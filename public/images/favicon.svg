<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#b84dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#b84dff"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>

  <text x="50%" y="55%" text-anchor="middle" fill="url(#neonGradient)" font-size="28" font-family="Share Tech Mono, monospace" font-weight="bold" filter="url(#glow)">
    ./
  </text>
</svg>
